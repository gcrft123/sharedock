[package]
name = "core-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
core-proto = { workspace = true }
core-crypto = { workspace = true }
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
iroh = { version = "1", optional = true, features = ["tls-ring"] }

[features]
# Direct P2P QUIC transport (LAN fast path). Opt-in so the heavy quinn/rustls tree
# stays out of default builds (webdav runner, desktop mount, default tests).
iroh = ["dep:iroh"]

[dev-dependencies]
tokio = { workspace = true }
core-proto = { workspace = true }
core-crypto = { workspace = true }
