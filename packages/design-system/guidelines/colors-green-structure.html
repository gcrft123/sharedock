<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}</style></head><body><div style="display:flex;gap:1px;background:var(--line);border:1px solid var(--line)"><div style="flex:1;background:var(--term-green);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(10,10,10,.85)">--term-green</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(10,10,10,.6)">#4AF626 · terminal OK only</span></div><div style="flex:1;background:var(--bg);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative"><i style="position:absolute;left:12px;right:12px;top:44%;height:1px;background:var(--line)"></i><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)">--line</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">hairlines · grid gaps</span></div><div style="flex:1;background:var(--bg);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;position:relative"><i style="position:absolute;left:12px;right:12px;top:44%;height:1px;background:var(--line-2)"></i><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)">--line-2</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">faint dividers</span></div><div style="flex:1;background:var(--edge);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)">--edge</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">#1B1916 · watermark wordmark</span></div></div></body></html>
