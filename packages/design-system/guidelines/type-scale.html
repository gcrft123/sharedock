<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}.tr{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line-2)}.tr:last-child{border-bottom:none}.tk{font:400 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:right;flex:none}</style></head><body><div class="tr"><span style="font:400 40px/0.82 var(--black);letter-spacing:-.045em;text-transform:uppercase;color:var(--fg)">EMBER</span><span class="tk">H1 · CLAMP(4.5REM, 15VW, 13REM) / 0.82</span></div>
   <div class="tr"><span style="font:400 30px/0.9 var(--black);letter-spacing:-.035em;text-transform:uppercase;color:var(--fg)">CAPABILITY</span><span class="tk">H2 · CLAMP(2REM, 5.4VW, 4.6REM) / 0.9</span></div>
   <div class="tr"><span style="font:500 18px/1.4 var(--grot);letter-spacing:-.01em;color:var(--fg-dim)">One feed, read <b style="color:var(--o);font-weight:600">at a glance</b>.</span><span class="tk">SUBHEAD · CLAMP(1.1REM, 2.3VW, 1.7REM)</span></div>

   <div class="tr"><span style="font:400 34px/1 var(--black);letter-spacing:-.04em;color:var(--fg)">99.98<em style="font:500 .32em var(--mono);font-style:normal;color:var(--o);vertical-align:super;letter-spacing:.08em">%</em></span><span class="tk">STAT · CLAMP(2.6REM, 5VW, 4REM) + MONO UNIT</span></div></body></html>
