<!-- @dsCard group="Texture" viewport="700x150" name="Industrial symbology" subtitle="Structural marks, not decoration · set in mono" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}.sym{padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:86px;justify-content:center}.sym b{font:400 17px/1 var(--mono);color:var(--fg);font-weight:400}.sym span{font:400 8.5px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}</style></head><body><div class="hairgrid" style="grid-template-columns:repeat(8,1fr)">
     <div class="sym"><b style="color:var(--faint)">+</b><span>crosshair</span></div>
     <div class="sym"><b style="color:var(--o)">●</b><span>live dot</span></div>
     <div class="sym"><b>◊</b><span>hud title</span></div>
     <div class="sym"><b style="color:var(--o)">◆</b><span>featured tab</span></div>
     <div class="sym"><b>[ 01 ]</b><span>index</span></div>
     <div class="sym"><b>///</b><span>separator</span></div>
     <div class="sym"><b>®©™</b><span>glyphs</span></div>
     <div class="sym"><b style="color:var(--o)">→</b><span>cta arrow</span></div>
   </div></body></html>
