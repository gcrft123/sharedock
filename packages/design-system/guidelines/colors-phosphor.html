<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}</style></head><body><div style="display:flex;gap:1px;background:var(--line);border:1px solid var(--line)"><div style="flex:1;background:var(--fg);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(10,10,10,.85)">--fg</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(10,10,10,.6)">#F3EEE7 · headlines</span></div><div style="flex:1;background:var(--fg-dim);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(10,10,10,.85)">--fg-dim</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(10,10,10,.6)">#B6AFA5 · body copy</span></div><div style="flex:1;background:var(--muted);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(10,10,10,.85)">--muted</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:rgba(10,10,10,.6)">#7C766C · labels ≥11px upper</span></div><div style="flex:1;background:var(--faint);height:106px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px"><b style="font:500 10px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)">--faint</b><span style="font:400 9px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">#4A453E · crosshairs · disabled</span></div></div></body></html>
