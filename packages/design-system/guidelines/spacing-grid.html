<!-- @dsCard group="Spacing" viewport="700x190" name="Hairline grid" subtitle="gap:1px on --line · solid cells · + crosshairs · hover warms in place" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}.mini{padding:16px;min-height:104px;display:flex;flex-direction:column;gap:8px}.mini:hover{background:var(--bg-panel)}</style></head><body><div class="hairgrid cols-3">
     <div class="mini"><span class="cross" aria-hidden="true">+</span><span style="font:500 11px/1 var(--mono);color:var(--o);letter-spacing:.14em">[ 01 ]</span><span style="font:400 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">CELL · --BG</span></div>
     <div class="mini"><span class="cross" aria-hidden="true">+</span><span style="font:500 11px/1 var(--mono);color:var(--o);letter-spacing:.14em">[ 02 ]</span><span style="font:400 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">GAP 1PX · --LINE</span></div>
     <div class="mini"><span class="cross" aria-hidden="true">+</span><span class="cross cross-br" aria-hidden="true">+</span><span style="font:500 11px/1 var(--mono);color:var(--o);letter-spacing:.14em">[ 03 ]</span><span style="font:400 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">NO PER-CELL BORDERS</span></div>
   </div>
   <p style="margin:14px 0 0;font:400 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">HOVER: BG --BG-PANEL · NEVER TRANSLATE INSIDE A 1PX GRID</p></body></html>
