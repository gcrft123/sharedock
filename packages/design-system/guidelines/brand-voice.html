<!-- @dsCard group="Brand" viewport="700x210" name="Voice · two registers" subtitle="Machine ~85% · human ~15% · no em-dashes anywhere" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--bg);padding:20px;font-family:var(--mono)}.vc{padding:20px;min-height:130px;display:flex;flex-direction:column;gap:10px}</style></head><body><div class="hairgrid cols-2">
     <div class="vc"><span class="cross" aria-hidden="true">+</span>
       <span style="font:500 10px/1 var(--mono);letter-spacing:.2em;color:var(--o)">MACHINE REGISTER</span>
       <p style="margin:0;font:400 12.5px/1.8 var(--mono);color:var(--fg-dim);text-transform:uppercase">FILES THAT STAY HOME.<br>DOCK A DEVICE.<br>DEVICE / A-01 · 128GB · SAMPLE FEED</p>
     </div>
     <div class="vc cell-warm"><span class="cross" aria-hidden="true">+</span>
       <span class="chip chip-amber" style="align-self:flex-start"><i aria-hidden="true"></i>Human register</span>
       <p style="margin:0;font:400 14.5px/1.6 var(--grot);color:var(--peach)">Old devices, new drive. Your files never leave home. Plain sentences, only in the warmest zone.</p>
     </div>
   </div>
   <p style="margin:14px 0 0;font:400 9.5px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">SEPARATORS: · , : PERIOD · NEVER EM-DASH · NO EMOJI</p></body></html>
