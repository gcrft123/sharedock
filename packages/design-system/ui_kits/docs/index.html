<div id="root"></div>
<script type="text/babel">
const { Nav, Terminal, PillChip, Crosshair } = window.MachineEmberDesignSystem_bd5c19;

const SIDE = [
  { h: 'Getting started', items: ['Overview', 'Install', 'Dock a device', 'Browse your files'] },
  { h: 'Reference', items: ['sharedock add', 'sharedock sync', 'sharedock status', 'Exit codes'] },
];

function Page() {
  const [active, setActive] = React.useState('Dock a device');
  return (
    <React.Fragment>
      <Nav logo="../../assets/brand/sharedock-logo.png" links={[{ label: 'Guides', href: '#' }, { label: 'CLI', href: '#' }, { label: 'Changelog', href: '#' }]} />
      <div className="docwrap" data-screen-label="Docs article">
        <nav className="docside" aria-label="Docs">
          {SIDE.map((g) => (
            <div key={g.h}>
              <h4>{g.h}</h4>
              {g.items.map((it) => (
                <a key={it} href="#" className={active === it ? 'on' : ''} onClick={(e) => { e.preventDefault(); setActive(it); }}>{it}</a>
              ))}
            </div>
          ))}
        </nav>
        <article className="doc">
          <p className="doc-crumb">DOCS /// GETTING STARTED /// <b>DOCK A DEVICE</b></p>
          <h1>Dock a device</h1>
          <p className="lead">Docking joins one old phone, laptop, or drive to your storage pool. It takes one command, and it is safe to run twice.</p>

          <h2 id="prereqs"><span>01</span>Prerequisites</h2>
          <p>You need the CLI at <code>rev 2.6</code> or later and a device on the same network. Nothing else: no account, no daemon, no open inbound port.</p>
          <div style={{ margin: '16px 0 0' }}><PillChip tone="amber" dot>Rev 2.6 or later</PillChip></div>

          <h2 id="install"><span>02</span>Install the CLI</h2>
          <p>One line, any POSIX shell. The installer prints what it does before it does it.</p>
          <Terminal static title="CONSOLE · INSTALL · LOCAL" lines={[
            { t: 'cmd', text: 'curl -fsS https://get.sharedock.app | sh' },
            { t: 'out', text: 'SHAREDOCK 2.6 INSTALLED · /usr/local/bin/sharedock' },
          ]} minHeight={0} />

          <h2 id="attach"><span>03</span>Dock</h2>
          <p>Point the CLI at the device. The handshake encrypts both ends and starts pooling its free space.</p>
          <div className="codeblock"><span className="p">$</span> <b>sharedock add --device A-01 --name closet-phone</b>{'\n'}LINK ESTABLISHED · ENCRYPTED · POOL JOINED{'\n'}DEVICE A-01 SERVING 128GB TO YOUR CLOUD</div>
          <p>If the network drops during docking, the device keeps the handshake and re-syncs on reconnect. You do not need to re-run anything.</p>

          <h2 id="flags"><span>04</span>Flags</h2>
          <dl className="hairgrid flags">
            <div className="flag"><dt>--device &lt;id&gt;</dt><dd>Device ID from <code>sharedock scan</code>. Required.</dd></div>
            <div className="flag"><dt>--name &lt;label&gt;</dt><dd>Friendly name for the device. Defaults to its hostname.</dd></div>
            <div className="flag"><dt>--timeout &lt;s&gt;</dt><dd>Handshake timeout in seconds. Default 30.</dd></div>
            <div className="flag"><dt>--dry-run</dt><dd>Print the plan, touch nothing.</dd></div>
          </dl>

          <div className="warmnote cell-warm">
            <Crosshair />
            <PillChip tone="peach" dot>Good to know</PillChip>
            <p>Docking is idempotent. Running it against a device that is already in the pool just verifies the link and exits clean, so you can leave it in a boot script.</p>
          </div>

          <h2 id="next"><span>05</span>Verify</h2>
          <p>Check the pool and watch the device report in. That line is the whole product.</p>
          <div className="codeblock"><span className="p">$</span> <b>sharedock status --device A-01</b>{'\n'}[ 08:14:22 ] A-01 ONLINE · 128GB · HEALTHY</div>

          <nav className="hairgrid cols-2 pn" aria-label="Previous and next">
            <a href="#"><span className="k">← Previous</span><span className="v">Install</span></a>
            <a href="#" style={{ textAlign: 'right' }}><span className="k">Next →</span><span className="v">Browse your files</span></a>
          </nav>
        </article>
      </div>
      <div className="grain" aria-hidden="true"></div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
