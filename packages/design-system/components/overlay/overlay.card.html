<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--bg);padding:24px;font-family:var(--mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;max-width:900px}
.live{margin-top:24px}
@media (max-width:720px){.row{grid-template-columns:1fr}}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { ConfirmDialog, Button } = window.MachineEmberDesignSystem_bd5c19;

function Demo() {
  const [open, setOpen] = React.useState(false);
  return (
    <React.Fragment>
      <div className="row">
        <ConfirmDialog embedded dismissible={false} tone="warning"
          title="Pause the pool?"
          confirmLabel="Pause" cancelLabel="Keep on">
          New transfers hold until you resume. Nothing already home is touched.
        </ConfirmDialog>
        <ConfirmDialog embedded dismissible={false} tone="confirm"
          title="Add this device?"
          confirmLabel="Add node" cancelLabel="Not now">
          It joins the pool and starts reporting capacity. You can remove it anytime.
        </ConfirmDialog>
      </div>
      <div className="live">
        <Button variant="primary" onClick={() => setOpen(true)}>Trigger danger dialog</Button>
      </div>
      <ConfirmDialog open={open} tone="danger"
        title="Remove node A-07?"
        confirmLabel="Remove" cancelLabel="Keep"
        onConfirm={() => setOpen(false)} onCancel={() => setOpen(false)}>
        This node leaves the pool. Your files never leave home, they re-pool across the other devices.
      </ConfirmDialog>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
